<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Filmes e Séries</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b0d12"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b0d12;--sf:#161a23;--tx:#f4f5f8;--mut:#98a0b3;--ac:#1a98ff;--bd:#252b38;--ok:#2fd27a}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 40px}
.wrap{max-width:960px;margin:0 auto}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 16px 6px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}.logo{font-weight:800;font-size:20px}
.pill{font-size:12px;font-weight:700;padding:6px 11px;border-radius:99px;border:1px solid var(--bd);background:var(--sf);color:var(--mut);cursor:pointer}.pill.ok{color:var(--ok);border-color:var(--ok)}
.nav{display:flex;gap:22px;margin-top:8px}.nav button{background:none;border:0;color:var(--mut);font-size:15px;font-weight:600;padding:8px 0;cursor:pointer;border-bottom:2px solid transparent}.nav button.on{color:var(--tx);border-color:var(--ac)}
.hero{position:relative;min-height:360px;display:flex;align-items:flex-end;overflow:hidden;margin-top:8px}
.cov,.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 4%,transparent 70%),linear-gradient(to right,#0b0d12bb,transparent 70%)}
.in{position:relative;z-index:2;padding:20px 16px;max-width:560px}.tag{font-size:12px;font-weight:700;color:var(--ac);letter-spacing:1px;text-transform:uppercase}
.hero h2{font-size:30px;margin:6px 0;line-height:1.1}.hero p{margin:0 0 14px;color:var(--mut);font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.b{border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;display:inline-flex;color:#fff;background:var(--ac)}.b.s{background:#ffffff24}
.row{margin:18px 0 4px}.row h3{margin:0 16px 10px;font-size:17px}
.rail{display:flex;gap:10px;overflow-x:auto;padding:0 16px 6px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.c{position:relative;flex:0 0 auto;width:210px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;cursor:pointer;background:var(--sf)}
.c .cap{position:absolute;inset:auto 0 0;padding:22px 8px 8px;background:linear-gradient(transparent,#000c);font-size:12px;font-weight:600}
.lk{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;background:#0009;display:grid;place-items:center;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:12px 16px}.grid .c{width:100%}
.gate{margin:10px 16px;padding:16px;border-radius:14px;background:#1a98ff22;border:1px solid var(--bd)}.gate h4{margin:0 0 4px}.gate p{margin:0 0 10px;color:var(--mut);font-size:13px}
.key{font:700 20px ui-monospace,monospace;letter-spacing:3px;text-align:center;padding:10px;background:var(--bg);border-radius:10px;margin-bottom:10px;user-select:all}
.ov{position:fixed;inset:0;z-index:40;background:#000b;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sf);width:100%;max-width:560px;border-radius:18px 18px 0 0;overflow-y:auto;max-height:92vh;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.pic{position:relative;aspect-ratio:16/9}.x{position:absolute;top:10px;right:10px;z-index:3;width:34px;height:34px;border-radius:50%;border:0;background:#000a;color:#fff;cursor:pointer}
.bd{padding:16px}.bd h2{margin:0 0 8px}.bd p{color:var(--mut);line-height:1.5;font-size:14px;white-space:pre-wrap}
.player{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.player iframe{flex:1;border:0;width:100%}.pb{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
.mut{color:var(--mut);padding:30px 16px}
.pw{position:fixed;inset:0;z-index:60;background:#000c;display:flex;align-items:center;justify-content:center;padding:14px}
.win{background:var(--sf);border-radius:16px;overflow:hidden;width:100%;max-width:760px;max-height:94vh;overflow-y:auto;box-shadow:0 20px 60px #000}
.fr{position:relative;height:70vh;max-height:calc(94vh - 110px);background:#000}.fr iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.blk{position:absolute;top:0;left:0;right:0;height:56px;z-index:2}
.wh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px 4px}.wd{padding:0 14px 16px;color:var(--mut);font-size:14px;line-height:1.5;white-space:pre-wrap}
.pw.big{padding:0}.pw.big .win{max-width:none;width:100%;height:100%;max-height:100%;border-radius:0;display:flex;flex-direction:column}.pw.big .fr{flex:1;height:auto;max-height:none}.pw.big .wd{display:none}
.c{width:auto;aspect-ratio:auto;height:200px;transition:transform .15s}.c:hover{transform:scale(1.03)}
.c .ci{height:100%;width:auto;min-width:120px;display:block}.c .ph{width:200px;height:100%;display:grid;place-items:center;font-size:42px;font-weight:800;color:#fff6}
.grid{display:flex;flex-wrap:wrap;gap:12px;padding:12px 16px}.grid .c{width:auto}
.bg{filter:blur(22px) brightness(.55);transform:scale(1.2)}
.hero{justify-content:space-between}
.hp{position:relative;z-index:2;height:300px;max-width:42%;margin:20px 16px;border-radius:12px;box-shadow:0 10px 40px #000a;object-fit:contain;align-self:center}
@media(max-width:560px){.hp{display:none}}
.ov{align-items:center;padding:16px}
.sheet{max-width:600px;border-radius:18px;max-height:90vh;padding-bottom:0;box-shadow:0 20px 60px #000}
.pic{aspect-ratio:auto;height:44vh;background:#000;overflow:hidden}
.pic .bgb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(20px) brightness(.5);transform:scale(1.2)}
.pic .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.x{width:42px;height:42px;border:2px solid #fff;background:#000c;font-size:18px;font-weight:700}
.wh{padding:12px 14px}.wh b{font-size:16px}
.wb{border:0;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:800;cursor:pointer;color:#fff;white-space:nowrap}.wb.f{background:var(--ac)}.wb.c2{background:#e5484d}
.srch{margin-top:8px}.srch input{width:100%;padding:11px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit;outline:none}.srch input:focus{border-color:var(--ac)}
.rail{flex-wrap:wrap;overflow:visible}
.row h3{display:flex;align-items:center;justify-content:space-between;gap:10px}.row h3 .b{padding:6px 12px;font-size:12px}
@media(max-width:560px){.rail .c{width:calc((100% - 20px)/3);height:auto;aspect-ratio:2/3}.rail .c .ci{width:100%;height:100%;min-width:0;object-fit:cover}.rail .c .ph{width:100%;font-size:30px}.rail .c .cap{font-size:11px;padding:18px 6px 6px}}
.eps{padding:6px 14px 10px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.eps select{background:#0006;color:#fff;border:1px solid #fff3;border-radius:8px;padding:8px 10px;font:inherit}
#elist{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:200px;max-height:84px;overflow-y:auto}.eb{min-width:38px;padding:7px 8px;border:1px solid #fff3;border-radius:8px;background:#ffffff14;color:#fff;font:inherit;font-size:13px;cursor:pointer}.eb.on{background:var(--ac);border-color:var(--ac)}
.eps+.fr{height:56vh;max-height:calc(94vh - 270px)}

/* ===== player: cabe em qualquer tela (celular em pé, deitado e PC) ===== */
.pw{padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.win{display:flex;flex-direction:column;overflow:hidden;max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
.wh{flex:none;flex-wrap:wrap;row-gap:8px}
.wh b{flex:1 1 140px;min-width:0;overflow-wrap:anywhere}
.wbs{display:flex;gap:8px;flex:0 1 auto}
.fr{flex:none;height:auto;aspect-ratio:16/9;max-height:calc(100vh - 210px);max-height:calc(100dvh - 210px)}
.eps{display:block;flex:1 1 auto;min-height:76px;overflow-y:auto;padding:10px 14px 12px}
.eps select{width:100%;max-width:300px;margin-bottom:10px}
#elist{display:flex;flex-wrap:wrap;gap:6px;flex:none;min-width:0;max-height:none;overflow:visible}
.eb{min-width:44px;padding:10px 8px}
.wd{flex:0 1 auto;min-height:0;max-height:20vh;max-height:20dvh;overflow-y:auto}
.pw.big .fr{flex:1;aspect-ratio:auto;max-height:none}
.pw.big .eps{flex:0 0 auto;max-height:26vh;max-height:26dvh}
@media(max-width:560px){
 .wbs{flex:1 1 100%}
 .wbs .wb{flex:1;padding:11px 8px;font-size:14px}
 .eps select{max-width:none}
}
/* ===== "Continuar assistindo": rola para o lado ===== */
.rail.hz{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.rail.hz::-webkit-scrollbar{display:block;height:6px}
.rail.hz::-webkit-scrollbar-thumb{background:#fff3;border-radius:3px}
.rail.hz .c{flex:0 0 auto;scroll-snap-align:start}
@media(max-width:560px){.rail.hz .c{width:29%;min-width:104px}}

/* ===== tela cheia: o menu some sozinho e o vídeo ocupa tudo ===== */
.ep2{display:none}
.wbs{flex-wrap:wrap}
.wbs .wb.rl{flex:0 0 auto;padding:11px 14px}
.pw.big .win{position:relative}
.pw.big .fr{position:absolute;inset:0;width:100%;height:100%;max-height:none;aspect-ratio:auto}
.pw.big .wh{position:absolute;top:0;left:0;right:0;z-index:5;background:linear-gradient(#000e,#0000);padding-top:max(12px,env(safe-area-inset-top));transition:opacity .25s}
.pw.big.hid .wh{opacity:0;pointer-events:none}
.pw.big .ep2{display:block}
.pw.big .eps{display:none}
.pw.big.sheet .eps{display:block;position:absolute;left:0;right:0;bottom:0;z-index:6;background:#000e;max-height:46vh;max-height:46dvh;overflow-y:auto;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.tap{display:none}
/* menu escondido em tela cheia: camada transparente pega o toque/mouse e traz o menu de volta */
.pw.big.hid:not(.sheet) .tap{display:block;position:absolute;inset:0;z-index:4;background:transparent;touch-action:none;-webkit-tap-highlight-color:transparent}
.pw.big .wd{display:none}
@media(max-width:560px){.wbs{flex-wrap:nowrap}.wbs .wb{min-width:0;padding:11px 6px;font-size:13px}.wbs .wb.rl{padding:11px 12px}.pw.big .wbs{flex-wrap:wrap}}
@media(max-width:560px){.pw.big .wbs .wb{flex:1 1 auto}.pw.big .wbs .wb.rl{flex:0 0 auto}}
</style><link rel="stylesheet" href="tv.css"></head><body>
<div class="wrap"><div class="top"><div class="bar"><div class="logo" id="logo"></div><div style="display:flex;gap:8px"><button class="pill" id="st"></button></div></div><div class="nav" id="nav"></div><div class="srch"><input id="q" type="search" placeholder="🔍  Buscar filme ou série..." autocomplete="off"></div></div><div id="app"></div></div>
<script src="supabase.min.js"></script>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.URL,CFG.ANON),$=i=>document.getElementById(i);
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
let S={q:'',tab:'home',lessons:[],cfg:{app_name:'Filmes e Séries',color:'#1a98ff',contact_url:''},until:0,key:'',det:null,inst:null};
try{S.dev=localStorage.getItem('did')||'';S.key=localStorage.getItem('dk')||'';const c=localStorage.getItem('cfg');if(c)S.cfg=JSON.parse(c)}catch(e){}
if(!S.dev){S.dev=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');try{localStorage.setItem('did',S.dev)}catch(e){}}
if(!S.key){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=()=>Array.from({length:4},()=>c[Math.random()*c.length|0]).join('');S.key=r()+'-'+r();try{localStorage.setItem('dk',S.key)}catch(e){}}
const ok=()=>S.until>Date.now();
/* ===== versão do app: se o painel exigir uma versão maior, este app trava e pede atualização ===== */
const APP_VER=2;
function checkVer(){const min=+((S.cfg||{}).min_version)||0,old=min>APP_VER;let o=$('upd');
 if(!old){if(o)o.remove();return}
 const p=$('pl');if(p)p.remove();const d=$('ov');if(d)d.remove();
 if(o)return;
 const url=(S.cfg||{}).update_url||(S.cfg||{}).contact_url||'';
 o=document.createElement('div');o.id='upd';
 o.style.cssText='position:fixed;inset:0;z-index:9999;background:#0b0d12;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font-family:inherit';
 o.innerHTML='<div style="font-size:48px">🔄</div><div style="font-size:20px;font-weight:700">Atualização necessária</div><div style="max-width:320px;opacity:.8;line-height:1.5">Esta versão do app não funciona mais. Peça o link da versão nova para o suporte e instale por cima.</div>'+(/^https?:\/\//.test(url)?'<a target="_blank" rel="noopener" href="'+esc(url)+'" style="margin-top:6px;padding:13px 22px;border-radius:12px;background:var(--ac,#1a98ff);color:#fff;font-weight:700;text-decoration:none">Pedir / baixar versão nova</a>':'');
 document.body.appendChild(o)}
const left=ms=>{const m=Math.max(0,ms/6e4|0),d=m/1440|0,h=m%1440/60|0;return d?d+'d '+h+'h':h?h+'h '+m%60+'min':m+'min'};
const grad=t=>{let h=0;for(const ch of t)h=(h*31+ch.charCodeAt(0))%360;return`linear-gradient(135deg,hsl(${h},65%,38%),hsl(${(h+50)%360},70%,18%))`};
const pic=(l,cls)=>l.cover_url?`<img class="${cls}" alt="" src="${esc(l.cover_url)}">`:`<div class="${cls}" style="background:${grad(l.title)};display:grid;place-items:center;font-size:42px;font-weight:800;color:#fff6">${esc(l.title[0]||'?').toUpperCase()}</div>`;
const norm=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const ci=l=>l.cover_url?`<img class="ci" alt="" src="${esc(l.cover_url)}">`:`<div class="ph" style="background:${grad(l.title)}">${esc(l.title[0]||'?').toUpperCase()}</div>`;
const pic2=l=>l.cover_url?`<img class="bgb" alt="" src="${esc(l.cover_url)}"><img class="fg" alt="" src="${esc(l.cover_url)}">`:`<div class="fg" style="background:${grad(l.title)};display:grid;place-items:center;font-size:64px;font-weight:800;color:#fff6">${esc(l.title[0]||'?').toUpperCase()}</div>`;
const LS=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}};
const progGet=id=>LS('prog')[id];
const progSet=(id,v)=>{try{const p=LS('prog');p[id]={...v,t:Date.now()};localStorage.setItem('prog',JSON.stringify(p))}catch(e){}};
function barra(ms){const p=$('pl');if(!p)return;p.classList.remove('hid');clearTimeout(p._t);p._t=setTimeout(()=>{if(p.classList.contains('big')&&!p.classList.contains('sheet'))p.classList.add('hid')},ms||3500)}
document.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement)return;const p=$('pl');if(p&&p.classList.contains('big')){p.classList.remove('big','sheet','hid');const b=p.querySelector('[data-a=big]');if(b)b.textContent='⛶ Tela cheia'}});
function reqBtn(){const u=S.cfg.contact_url;if(!u)return'';const m=encodeURIComponent('Olá! Quero liberar meu acesso. Minha chave: '+S.key);return`<a class="b" target="_blank" rel="noopener" href="${esc(/wa\.me|whatsapp|t\.me/.test(u)?u.split('?')[0]+'?text='+m:u)}">Solicitar acesso</a>`}
const card=l=>`<div class="c" data-open="${l.id}">${ci(l)}${ok()?'':'<div class="lk">🔒</div>'}<div class="cap">${esc(l.title)}</div></div>`;
const rail=(t,L,tab,max,hz)=>L.length?`<div class="row"><h3><span>${t}</span>${tab&&L.length>max?`<button class="b s" data-tab="${tab}">Ver todos</button>`:''}</h3><div class="rail${hz?' hz':''}">${(max?L.slice(0,max):L).map(card).join('')}</div></div>`:'';
const gate=()=>ok()?'':`<div class="gate"><h4>🔓 Libere seu acesso</h4>${S.limit?'<p><b>Limite de aparelhos atingido.</b> Esta chave já está em uso no número máximo de aparelhos. Peça ao suporte para liberar mais um.</p>':'<p>Você pode ver todo o catálogo. Para assistir, envie a chave do seu aparelho:</p>'}<div class="key">${S.key}</div><div class="btns"><button class="b s" data-a="copy">Copiar chave</button>${reqBtn()}</div><div style="margin-top:14px"><div style="font-size:13px;opacity:.75;margin-bottom:6px">Já tem uma chave liberada em outro aparelho?</div><input id="kin" placeholder="Digite a chave (XXXX-XXXX)" maxlength="9" autocomplete="off" autocapitalize="characters" style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #fff3;background:#0006;color:#fff;font:inherit;text-transform:uppercase"><button class="b s" data-a="usekey" style="margin-top:8px;width:100%">Usar essa chave</button></div></div>`;
function render(){
 const A=S.cfg;document.documentElement.style.setProperty('--ac',A.color);document.title=A.app_name;$('logo').textContent=A.app_name;
 const st=$('st');st.className='pill'+(ok()?' ok':'');st.textContent=ok()?'✓ Ativo · '+left(S.until-Date.now()):'🔒 Sem acesso';
 $('nav').innerHTML=[['home','Início'],['long','Filmes'],['short','Séries']].map(t=>`<button class="${S.tab==t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('');
 const L=S.lessons,lo=L.filter(l=>l.type=='long'),sh=L.filter(l=>l.type=='short'),pg=LS('prog'),cont=Object.keys(pg).sort((a,b)=>pg[b].t-pg[a].t).map(i=>L.find(l=>l.id==i)).filter(Boolean);let h='';
 if(!L.length)h='<div class="mut">Nenhum conteúdo publicado ainda.</div>';
 else if(S.q){const lim=t=>norm(t).replace(/[^a-z0-9\s]/g,' '),q=lim(S.q).split(/\s+/).filter(Boolean),R=L.filter(l=>{const t=lim(l.title+' '+l.descr);return q.every(w=>t.includes(w))});h=gate()+(R.length?`<div class="row"><h3>${R.length} resultado${R.length>1?'s':''} para “${esc(S.q)}”</h3></div><div class="grid">${R.map(card).join('')}</div>`:`<div class="mut">Nada encontrado para “${esc(S.q)}”.</div>`)}
 else if(S.tab=='home'){const f=L[0];h=`<div class="hero">${pic(f,'bg')}<div class="in"><div class="tag">Em destaque</div><h2>${esc(f.title)}</h2><p>${esc(f.descr)}</p><div class="btns"><button class="b" data-play="${f.id}">${ok()?'▶ Assistir':'🔒 Assistir'}</button><button class="b s" data-open="${f.id}">Detalhes</button></div></div>${f.cover_url?`<img class="hp" alt="" src="${esc(f.cover_url)}">`:''}</div>`+gate()+rail('Continuar assistindo',cont,null,15,true)+rail('Em destaque',L.slice(0,3))+rail('Filmes',lo,'long',6)+rail('Séries',sh,'short',6)}
 else{const X=S.tab=='long'?lo:sh;h=gate()+(X.length?`<div class="grid">${X.map(card).join('')}</div>`:'<div class="mut">Nada por aqui ainda.</div>')}
 $('app').innerHTML=h;const o=$('ov');if(o)o.remove();if(S.det)detail(S.det);
 
}
function detail(id){const l=S.lessons.find(x=>x.id==id);if(!l){S.det=null;return}S.det=id;const o=document.createElement('div');o.className='ov';o.id='ov';
 o.innerHTML=`<div class="sheet"><div class="pic">${pic2(l)}<button class="x" data-a="closedet">✕</button></div><div class="bd"><div class="tag">${l.type=='short'?'Série':'Filme'}</div><h2>${esc(l.title)}</h2><p>${esc(l.descr)}</p>${ok()?`<button class="b" data-play="${l.id}">▶ Assistir agora</button>`:`<div class="key">${S.key}</div><p style="margin-top:0">Envie esta chave para liberar seu acesso.</p><div class="btns"><button class="b s" data-a="copy">Copiar chave</button>${reqBtn()}</div>`}</div></div>`;document.body.appendChild(o)}
async function play(id){
 if(!ok()){detail(id);return}
 const {data,error}=await sb.rpc('get_video',{p_key:S.key,p_lesson:id,p_dev:S.dev});
 if(error||!data){await checkAccess();return alert('Acesso expirado ou bloqueado.')}
